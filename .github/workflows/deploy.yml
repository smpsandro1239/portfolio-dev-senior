name: Build and Deploy Portfolio

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: portfolio-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    # Permissões explícitas necessárias para GitHub Pages deployment
    permissions:
      contents: write  # Necessário para push ao branch gh-pages
      pages: write     # Necessário para GitHub Pages
      id-token: write  # Necessário para autenticação
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: npm
        
    - name: Verify Node.js and npm versions
      run: |
        echo "Node.js version: $(node --version)"
        echo "npm version: $(npm --version)"
        echo "ESLint version: $(npx eslint --version)"
        
    - name: Install dependencies
      run: npm ci

    # --- Validações de código (usam os scripts npm) ---
    - name: Validate HTML
      run: npm run lint:html
        
    - name: Validate CSS
      run: npm run lint:css
        
    - name: Validate JavaScript (ESLint v9)
      run: npm run lint:js

    - name: Run automated tests
      run: npm test -- --runInBand
      
    # Backup: Direct ESLint execution (if npm script fails)
    - name: Validate JavaScript (Direct ESLint - Backup)
      if: failure()
      run: npx eslint src/js/

    # --- Build dos assets de produção ---
    - name: Build production assets
      run: npm run build

    # --- Lighthouse CI (após build) ---
    - name: Start local server for Lighthouse
      run: |
        npx serve -s docs -l 8080 &
        echo $! > server.pid
        sleep 5
        
    - name: Run Lighthouse CI
      uses: treosh/lighthouse-ci-action@v10
      with:
        configPath: './lighthouserc.json'
        uploadArtifacts: false
        temporaryPublicStorage: false
        
    # --- Verificação de budget de performance ---
    - name: Performance Budget Check
      id: perf-check
      run: |
        echo "Checking performance budget..."
        
        css_size=0
        for file in docs/css/*.css; do
          if [ -f "$file" ]; then
            size=$(stat -c%s "$file")
            css_size=$((css_size + size))
          fi
        done

        if [ $css_size -gt 51200 ]; then
          echo "❌ Total CSS too large: ${css_size} bytes (limit: 50KB)"
          exit 1
        else
          echo "✅ Total CSS size OK: ${css_size} bytes"
        fi
        
        js_total=0
        for file in docs/js/*.js; do
          if [ -f "$file" ]; then
            size=$(stat -c%s "$file")
            js_total=$((js_total + size))
          fi
        done
        
        if [ $js_total -gt 102400 ]; then
          echo "❌ JavaScript files too large: ${js_total} bytes (limit: 100KB)"
          exit 1
        else
          echo "✅ JavaScript size OK: ${js_total} bytes"
        fi
        
        echo "css_size=$css_size" >> $GITHUB_OUTPUT
        echo "js_total=$js_total" >> $GITHUB_OUTPUT

    # Install a ChromeDriver version matched to the Chrome binary on the runner.
    - name: Install matching ChromeDriver
      run: |
        npm install --global browser-driver-manager
        npx browser-driver-manager install chrome

    # --- Teste de acessibilidade real com axe-core ---
    - name: Accessibility Test
      run: |
        # Server is already running from Lighthouse step
        npx @axe-core/cli http://localhost:8080
        npx @axe-core/cli http://localhost:8080/projetos.html

    - name: Stop local server
      if: always()
      run: |
        if [ -f server.pid ]; then
          kill $(cat server.pid) || true
          rm server.pid
        fi

    # --- Verificação da pasta docs antes do deploy ---
    - name: Verify docs directory
      run: |
        echo "Verificando conteúdo da pasta docs..."
        ls -la docs/
        for required_file in docs/index.html docs/projetos.html docs/manifest.json docs/sw.js docs/robots.txt docs/sitemap.xml docs/css/main.css docs/css/case-studies.css docs/js/main.js; do
          if [ ! -f "$required_file" ]; then
            echo "❌ Ficheiro obrigatório em falta: $required_file"
            exit 1
          fi
          echo "✅ $required_file"
        done

    # --- Deploy para GitHub Pages (só na main) ---
    - name: Deploy to GitHub Pages
      if: github.ref == 'refs/heads/main'
      uses: peaceiris/actions-gh-pages@v4
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./docs

    # --- Relatório final claro e fiável ---
    - name: Generate Build Report
      if: always()
      run: |
        {
          echo "## Build Report 📊"
          echo ""
          echo "### File Sizes"
          echo "| File | Size (bytes) |"
          echo "|------|--------------|"
          
          for file in docs/css/*.css docs/js/*.js; do
            if [ -f "$file" ]; then
              size=$(stat -c%s "$file")
              filename=$(basename "$file")
              echo "| $filename | $size |"
            fi
          done
          
          echo ""
          echo "### Validation Results"
          echo "- Checks configured: HTML, CSS, JavaScript, Jest, Lighthouse, axe-core and asset-size budgets."
          echo "- Consult the individual step results above; this summary does not infer success."
          
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "- Deployment step is part of this run; check its result above."
          fi
          
          echo ""
          echo "> Report generated on $(date -u '+%Y-%m-%d at %H:%M UTC')"
        } >> $GITHUB_STEP_SUMMARY